name: Deploy NurtureMom to Cloudflare

on:
  push:
    branches:
      - main
      - phase2-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nurturemom-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: ${{ github.ref_name == 'phase2-preview' && 'deploy --config wrangler.preview.jsonc' || 'deploy' }}
