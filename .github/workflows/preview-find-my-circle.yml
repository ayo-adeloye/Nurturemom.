name: Cloudflare Find My Circle Preview

on:
  push:
    branches:
      - preview/find-my-circle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6
      - name: Deploy temporary Cloudflare preview
        run: npx wrangler@4 deploy --config wrangler.preview.jsonc --temporary
