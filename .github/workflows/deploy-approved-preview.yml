name: Deploy approved NurtureMom preview to Cloudflare

on:
  push:
    branches:
      - approved-cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nurturemom-approved-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy temporary Cloudflare preview
        run: npx wrangler@4 deploy --config wrangler.preview.jsonc --temporary
