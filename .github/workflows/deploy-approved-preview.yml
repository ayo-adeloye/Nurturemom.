name: Deploy approved NurtureMom preview to Cloudflare

on:
  push:
    branches:
      - approved-cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nurturemom-approved-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy approved preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.preview.jsonc
